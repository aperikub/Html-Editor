<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Éditeur HTML ServiceNow - listes imbriquées</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>ServiceNow Work Note Generator</h1>
  &nbsp;
  <div class="toolbar">
    <button type="button" onclick="runCmd('bold')"><strong>B</strong></button>
    <button type="button" onclick="runCmd('italic')"><em>Italique</em></button>
    <button type="button" onclick="runCmd('underline')"><u>U</u></button>
    <button type="button" onclick="runCmd('strikeThrough')"><s>Barré</s></button>

    <button type="button" onclick="runCmd('insertUnorderedList')">Liste à puces</button>
    <button type="button" onclick="runCmd('insertOrderedList')">Liste numérotée</button>
    
    <button type="button" onclick="outdentList()">&lt;&lt;</button>
	<button type="button" onclick="indentList()">&gt;&gt;</button>

    <select id="blockFormat" onchange="applyBlockFormat()">
      <option value="">Format</option>
      <option value="div">Texte</option>
      <option value="h1">Titre 1</option>
      <option value="h2">Titre 2</option>
      <option value="h3">Titre 3</option>
      <option value="blockquote">Citation</option>
    </select>

    <button type="button" onclick="createLink()">Lien</button>
    <button type="button" id="unlinkBtn" onclick="removeCurrentLink()" disabled>Retirer lien</button>
    <button type="button" onclick="insertImage()">Image</button>

    <label>
      Couleur
      <input type="color" id="foreColor" value="#000000" onchange="applyColor('foreColor', this.value)">
    </label>

    <label>
      Surlignage
      <input type="color" id="hiliteColor" value="#ffff00" onchange="applyColor('hiliteColor', this.value)">
    </label>

    <button type="button" onclick="clearFormatting()">Effacer format</button>
  </div>

  <div id="editor" contenteditable="true" data-placeholder="Écris ici ton contenu..."></div>

  <div class="actions" style="margin-top:12px;">
    <button type="button" onclick="generateHtml()">Générer le HTML</button>
    <button type="button" onclick="copyHtml()">Copier le HTML</button>
    <button type="button" onclick="clearEditor()">Vider</button>
  </div>

  <div class="section-title">HTML généré</div>
  <textarea id="output" readonly></textarea>
  <div class="small-note">
    L’indentation des listes est maintenant structurelle. Exemple attendu :
    <br>5. Élément principal
    <br>&nbsp;&nbsp;&nbsp;1. Sous-élément
    <br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;1. Sous-sous-élément
    <br>Le HTML généré reste encadré par <code>[code]</code> et <code>[/code]</code>.
  </div>

  <script src="script.js"></script>
</body>
</html>
